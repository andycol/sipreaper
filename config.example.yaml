# SIPReaper Configuration
# Copy this file to /etc/sipreaper/config.yaml and adjust as needed.

# Ingest
ingest:
  log:
    enabled: true
    path: "/var/log/kamailio/kamailio.log"
    format: "kamailio"           # kamailio | opensips | custom
    custom_patterns: []
  syslog:
    enabled: false
    listen: "0.0.0.0:1514"
  pcap:
    enabled: true
    interface: "eth0"
    ports: [5060, 5061]
    bpf_filter: ""

# Detection
detectors:
  brute_force:
    enabled: true
    max_attempts: 5
    window: 60s
  invite_flood:
    enabled: true
    max_requests: 50
    window: 10s
  scanner:
    enabled: true
    max_probes: 10
    window: 30s
    known_agents: ["friendly-scanner", "sipcli", "sipvicious"]
  invalid_request:
    enabled: true
    max_invalid: 3
    window: 60s
  geo_anomaly:
    enabled: true
    allowed_countries: ["GB", "US"]
    geoip_db: "/usr/share/GeoIP/GeoLite2-Country.mmdb"
  user_enum:
    enabled: true
    max_extensions: 10
    window: 60s
  # Triggers when the SIP server itself has rejected a request (e.g. carrier
  # source not whitelisted, denied/forbidden). High-confidence signal — defaults
  # to a single rejection inside the window.
  server_rejected:
    enabled: true
    max_hits: 1
    window: 5m
  # Decoy extensions / DIDs no real user dials. First request to any of these
  # bans the source forever (well — for the configured permaban duration).
  honeypot:
    enabled: false
    extensions: ["1000", "0000", "admin", "test"]
  # Toll-fraud reconnaissance: high failure rate on outbound INVITEs from one IP.
  failed_call_ratio:
    enabled: false
    min_calls: 20
    min_ratio: 0.8
    window: 5m
  # One IP reaching for many distinct DIDs in a short window — dial-plan probing.
  did_scanner:
    enabled: false
    max_dids: 20
    window: 5m

# Whitelist
whitelist:
  static:
    - ip: "10.0.0.0/8"
      comment: "Internal network"
    - ip: "172.16.0.0/12"
      comment: "Internal network"
    - ip: "192.168.0.0/16"
      comment: "Internal network"

# Bans
bans:
  durations: [5m, 30m, 2h, 24h, 0]
  cooldown: 48h
  check_interval: 30s

# Enforcement
enforcer:
  type: "iptables"           # iptables | ipset
  chain: "SIPREAPER"
  set_name: "sipreaper"      # only used when type=ipset
  # When true, sipreaper records would-be bans (status=dry_run) and emits
  # notifications + metrics, but never touches the firewall. Use this for a
  # week to tune detector thresholds against your real traffic, then flip off.
  dry_run: false
  # Kernel-side per-IP INVITE rate limit. Drops volumetric INVITE floods at the
  # firewall *before* userspace sees them — protects the SIP server from being
  # knocked over while sipreaper is detecting.
  prefilter:
    enabled: false
    rate: 5                  # INVITEs / sec / source IP
    burst: 10
    ports: [5060, 5061]
  # XDP kernel-fastpath drop. Banned IPs are dropped at the NIC/driver layer
  # (XDP_DROP) before the netfilter INPUT path and before the AF_PACKET tap —
  # eliminating the softirq cost a flood pays under iptables/ipset. Rollout is
  # additive and fail-open: if XDP can't attach (unsupported NIC/kernel, no
  # bpffs, another XDP prog present) the daemon logs a warning and stays on the
  # `type` backend above. Requires kernel >= 5.7, bpffs at /sys/fs/bpf, and
  # CAP_BPF + CAP_NET_ADMIN (see sipreaper.service). See docs/runbook-xdp.md.
  xdp:
    enabled: false
    # NIC to attach to. Defaults to ingest.pcap.interface when empty.
    interface: ""
    # "" = auto (try native driver, fall back to generic/SKB) | native | generic
    mode: ""
    # When true, XDP is the ONLY backend (no per-IP iptables/ipset rules). Only
    # flip this on AFTER the Phase 5 benchmark proves parity-or-better; rolling
    # back to false + restart re-populates iptables from the active bans.
    standalone: false

# Notifications
notifiers:
  syslog:
    enabled: true
  email:
    enabled: true
    smtp_host: "smtp.example.com"
    smtp_port: 587
    tls: true
    from: "sipreaper@example.com"
    to: ["admin@example.com"]
    username: "sipreaper@example.com"
    password_env: "SIPREAPER_SMTP_PASS"
    min_severity: "medium"

# API
api:
  listen: "127.0.0.1:8080"
  token_env: "SIPREAPER_API_TOKEN"

# Storage
storage:
  path: "/var/lib/sipreaper/sipreaper.db"

# Logging
logging:
  level: "info"
  output: "stdout"
  file: "/var/log/sipreaper/sipreaper.log"
